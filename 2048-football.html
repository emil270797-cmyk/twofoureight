<title>2048 Football</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#ffd23f;--ink:#08162b;--pitch:#0f5a2a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 0,#1b4f9c 0,#0b1d3a 55%,#08162b 100%);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;overflow:hidden}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,var(--pitch));opacity:.7;pointer-events:none;z-index:0}
.wrap{width:min(94vw,460px,calc(100dvh - 300px));position:relative;z-index:1}
h1{margin:0 0 8px;font:900 clamp(26px,8vw,38px)/1 Impact,"Arial Black",sans-serif;letter-spacing:1px;color:var(--gold);text-shadow:0 3px 0 #a86a00,0 6px 12px rgba(0,0,0,.5)}
h1 small{display:block;color:#fff;font-size:.5em;text-shadow:0 2px 0 #000;letter-spacing:6px}
.bar{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.box{flex:1;background:#0d2447;border:2px solid #2a5aa8;border-radius:12px;padding:6px 10px;text-align:center}
.box b{display:block;font:900 22px/1.1 Impact,sans-serif;color:var(--gold)}
.box span{font-size:12px;color:#a9c4ee}
button{font:700 14px "Trebuchet MS",sans-serif;color:#2b1a00;background:linear-gradient(#ffe27a,#ffb800);border:0;border-bottom:4px solid #b57a00;border-radius:12px;padding:0 14px;cursor:pointer}
button:active{transform:translateY(2px);border-bottom-width:2px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.sec{background:linear-gradient(#cfe1ff,#8fb2ee);border-bottom-color:#4f74b8;color:#0a1d3d}
#board{position:relative;width:100%;aspect-ratio:1;background:#071a36;border:3px solid #2a5aa8;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cellbg{position:absolute;border-radius:16%;background:rgba(255,255,255,.07)}
.tile{position:absolute;left:0;top:0;transition:transform .16s cubic-bezier(.25,.8,.35,1);will-change:transform;border-radius:16%;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.tile img{width:100%;height:100%;display:block;pointer-events:none}
.badge{position:absolute;right:6%;bottom:4%;font:900 clamp(12px,4vw,20px) Impact,sans-serif;color:var(--gold);text-shadow:0 2px 0 #000,0 0 6px #000}
.spawn{animation:sp .22s ease-out .14s backwards}

@keyframes sp{from{scale:.3;opacity:0}to{scale:1;opacity:1}}

#ov{position:absolute;inset:0;border-radius:16px;background:rgba(5,15,35,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:50}
#ov h2{margin:0;font:900 32px Impact,sans-serif;color:var(--gold)}
#ov p{margin:0;color:#d6e4ff}
#ov div{display:flex;gap:10px}
#ov button{padding:12px 18px;font-size:16px}
.hint{font-size:12px;color:#a9c4ee;text-align:center;margin-top:10px}
.banner{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;padding:6px 8px;z-index:5}.banner adsgram-task{display:block;width:min(94vw,460px)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.spawn,.merge{animation:none}}
</style>

function place(t){t.el.style.width=t.el.style.height=cell+'px';t.el.style.transform='translate('+(gap+t.c*(cell+gap))+'px,'+(gap+t.r*(cell+gap))+'px)'}
function setImg(t){t.im.src=IM[Math.min(t.v,2048)];t.b.textContent=t.v>2048?t.v:''}
function mk(v,r,c,spawn){const el=document.createElement('div');el.className='tile'+(spawn?' spawn':'');const im=new Image();im.draggable=false;const b=document.createElement('span');b.className='badge';el.append(im,b);board.insertBefore(el,ov);const t={v,r,c,el,im,b};setImg(t);g[r][c]=t;place(t);return t}
function bg(){board.querySelectorAll('.cellbg').forEach(e=>e.remove());for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=document.createElement('div');d.className='cellbg';d.style.cssText='width:'+cell+'px;height:'+cell+'px;left:'+(gap+c*(cell+gap))+'px;top:'+(gap+r*(cell+gap))+'px';board.insertBefore(d,board.firstChild)}}
function clear(){board.querySelectorAll('.tile').forEach(e=>e.remove());g=Array.from({length:4},()=>Array(4).fill(null))}
function add(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!g[r][c])e.push([r,c]);if(!e.length)return;const [r,c]=e[Math.random()*e.length|0];mk(Math.random()<.9?2:4,r,c,true)}
function ui(){document.getElementById('sc').textContent=score;if(score>best){best=score;try{localStorage.setItem('f2048best',best)}catch(e){}}document.getElementById('bs').textContent=best}
function snap(){return{s:g.map(r=>r.map(t=>t?t.v:0)),sc:score}}
function hide(){ov.style.display='none';blocked=false}
function show(t,p,btns){document.getElementById('ot').textContent=t;document.getElementById('op').textContent=p;const ob=document.getElementById('ob');ob.innerHTML='';btns.forEach(([l,f,s])=>{const b=document.createElement('button');b.textContent=l;if(s)b.className='sec';b.onclick=f;ob.appendChild(b)});ov.style.display='flex';blocked=true}
function newGame(){hide();clear();score=0;prev=null;won=false;over=false;metrics();bg();add();add();ui()}
function undo(){if(!prev)return;hide();clear();metrics();prev.s.forEach((row,r)=>row.forEach((v,c)=>{if(v)mk(v,r,c,false)}));score=prev.sc;prev=null;over=false;ui()}
const AD_REWARD='YOUR_REWARDED_BLOCK_ID',AD_INT='int-YOUR_INTERSTITIAL_BLOCK_ID',AD_TASK='task-YOUR_BLOCK_ID';
let adBusy=false,gamesDone=0;const ctl={};
function adShow(id){return new Promise(res=>{if(!/^(int-)?\d+$/.test(id))return res({done:false,err:true});try{const c=ctl[id]||(ctl[id]=window.Adsgram.init({blockId:id}));c.show().then(r=>res({done:!!(r&&r.done)})).catch(r=>res({done:false,err:!!(r&&r.error)}))}catch(e){res({done:false,err:true})}})}
function undoAd(){if(!prev||adBusy)return;adBusy=true;adShow(AD_REWARD).then(r=>{adBusy=false;if(r.done||r.err)undo()})}
function cellsOf(d,i){const a=[];for(let j=0;j<4;j++)a.push(d==0?[i,j]:d==2?[i,3-j]:d==1?[j,i]:[3-j,i]);return a}
function canMove(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!g[r][c])return true;const v=g[r][c].v;if(c<3&&g[r][c+1].v==v)return true;if(r<3&&g[r+1][c].v==v)return true}return false}
function move(d){
 if(blocked||over||adBusy)return;
 const sn=snap();let moved=false;const gone=[],merged=[];
 for(let i=0;i<4;i++){
  const cs=cellsOf(d,i),list=cs.map(([r,c])=>g[r][c]).filter(Boolean),out=[];
  for(const t of list){const last=out[out.length-1];
   if(last&&last.v===t.v&&!last.m){last.v*=2;last.m=true;score+=last.v;const [r,c]=cs[out.length-1];t.r=r;t.c=c;gone.push(t);merged.push(last);moved=true}
   else out.push(t)}
  cs.forEach(([r,c])=>g[r][c]=null);
  out.forEach((t,k)=>{const [r,c]=cs[k];if(t.r!==r||t.c!==c)moved=true;t.r=r;t.c=c;g[r][c]=t});
 }
 if(!moved)return;
 prev=sn;
 g.flat().forEach(t=>{if(t){delete t.m;place(t)}});
 gone.forEach(t=>{t.el.style.zIndex=0;place(t);setTimeout(()=>t.el.remove(),170)});
 merged.forEach(t=>{t.el.style.zIndex=2;setTimeout(()=>setImg(t),150)});
 add();ui();
 if(!won&&g.flat().some(t=>t&&t.v>=2048)){won=true;setTimeout(()=>show('Холанд собран!','Ты дошёл до 2048. Играем дальше?',[['Продолжить',hide],['Заново',newGame,1]]),250)}
 else if(!canMove()){over=true;gamesDone++;const f=()=>show('Игра окончена','Счёт: '+score+'. Ходов больше нет.',[['Заново',newGame],['Отменить ход',undoAd,1]]);setTimeout(()=>{if(gamesDone%2){f();return}adBusy=true;adShow(AD_INT).then(()=>{adBusy=false;f()})},250)}
}
addEventListener('keydown',e=>{const m={ArrowLeft:0,a:0,ArrowUp:1,w:1,ArrowRight:2,d:2,ArrowDown:3,s:3}[e.key];if(m!==undefined){e.preventDefault();move(m)}});
let sx,sy;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx<0?0:2):(dy<0?1:3))});
document.getElementById('ng').onclick=newGame;document.getElementById('un').onclick=undoAd;
addEventListener('resize',()=>{metrics();bg();g.flat().forEach(t=>t&&place(t))});
try{const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}}catch(e){}
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
if(/^task-\d+$/.test(AD_TASK)){const t=document.createElement('adsgram-task');t.setAttribute('data-block-id',AD_TASK);t.setAttribute('data-debug','false');document.getElementById('bn').appendChild(t)}
newGame();
</script></body></html>
